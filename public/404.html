<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Off course · Minpaku</title>
    <meta name="robots" content="noindex" />
    <link rel="icon" href="/favicon.svg" type="image/svg+xml" />
    <style>
      body {
        margin: 0;
        min-height: 100svh;
        display: grid;
        place-items: center;
        padding: 24px;
        box-sizing: border-box;
        font-family: system-ui, -apple-system, "Segoe UI", sans-serif;
        color: #10121f;
        background: linear-gradient(180deg, #8fd4f5 0%, #e9f8fc 70%);
        text-align: center;
      }
      .card {
        max-width: 28rem;
        padding: 40px 32px;
        border-radius: 30px;
        background: rgba(255, 255, 255, 0.9);
        box-shadow: 0 18px 40px -18px rgba(30, 60, 90, 0.45);
      }
      img {
        width: 72px;
        height: 72px;
        transform: rotate(-12deg);
      }
      h1 {
        margin: 20px 0 8px;
        font-size: 30px;
      }
      p {
        margin: 0 0 24px;
        line-height: 1.6;
        color: #4e5368;
      }
      a {
        display: inline-block;
        padding: 12px 22px;
        border-radius: 999px;
        font-weight: 800;
        text-decoration: none;
        color: #fff;
        background: linear-gradient(180deg, #e2556c, #9b1b30);
      }
    </style>
  </head>
  <body>
    <main class="card">
      <img src="/favicon.svg" alt="" />
      <h1>This flight went off course</h1>
      <p>We couldn't find that page. 申し訳ありません、ページが見つかりませんでした。</p>
      <a href="/">Back to Minpaku · トップへ</a>
    </main>
  </body>
</html>
